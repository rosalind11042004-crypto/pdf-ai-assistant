<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - PDF 学习助手</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <div class="page-wrapper">
        <main class="main-card auth-card">
            <header class="hero">
                <p class="eyebrow">PDF AI Assistant</p>
                <h1>登录</h1>
                <p class="subtitle">登录后查看和管理你自己的 PDF 文档。</p>
            </header>

            <form method="post" action="{{ url_for('login') }}" class="assistant-form">
                {% if message %}
                    <p class="upload-message">{{ message }}</p>
                {% endif %}

                <label for="email" class="field-label">邮箱</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    value="{{ email or '' }}"
                    autocomplete="email"
                    required
                >

                <label for="password" class="field-label">密码</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    autocomplete="current-password"
                    required
                >

                <button type="submit" class="primary-btn">登录</button>
            </form>

            <p class="auth-switch">
                还没有账号？<a href="{{ url_for('register') }}">注册</a>
            </p>
        </main>
    </div>
</body>
</html>
